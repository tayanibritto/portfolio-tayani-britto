name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto para a venv do GitHub
        uses: actions/checkout@v4

      - name: Instalação do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalação de dependências
        run: npm ci

      - name: Rodar Prettier Check
        run: npm run format:check

      - name: Rodar ESLint
        run: npm run lint

      - name: Rodar testes
        run: npm test
